name: Keep sites alive

# Runs on days 1, 6, 11, 16, 21 and 26 of every month: six visits per 30 days,
# with a maximum gap of six days. InfinityFree needs at least five visitors in
# any 30-day window, so this leaves real headroom even if a run fails.
on:
  schedule:
    - cron: '17 4 */5 * *'
  workflow_dispatch:
    inputs:
      shards:
        description: 'Parallel jobs to split the site list across'
        required: false
        default: '4'
      concurrency:
        description: 'Browser tabs per job'
        required: false
        default: '4'
      limit:
        description: 'Only visit the first N sites (0 = all). For testing.'
        required: false
        default: '0'
      jitter:
        description: 'Random start delay in minutes (0 to disable)'
        required: false
        default: '25'

# Never let two runs visit the same sites at once, and never cancel a run
# halfway through - a half-finished pass leaves sites unvisited.
concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      shards: ${{ steps.build.outputs.shards }}
    steps:
      - id: build
        run: |
          SHARDS="${{ github.event.inputs.shards || '4' }}"
          echo "shards=$SHARDS" >> "$GITHUB_OUTPUT"
          MATRIX=$(python3 -c "import json,sys; print(json.dumps(list(range(int(sys.argv[1])))))" "$SHARDS")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Splitting across $SHARDS shard(s): $MATRIX"

  visit:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Playwright with Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      # Real traffic does not arrive at 04:17 sharp every time. Each shard waits
      # a different random amount, which also spreads load on the host.
      - name: Stagger start
        run: |
          JITTER="${{ github.event.inputs.jitter || '25' }}"
          if [ "$JITTER" -gt 0 ]; then
            SECS=$(( (RANDOM % (JITTER * 60)) + (${{ matrix.shard }} * 37) ))
            echo "Waiting ${SECS}s before starting shard ${{ matrix.shard }}"
            sleep "$SECS"
          fi

      # GHKA_TOKEN is the shared secret for the GH Keep-Alive WordPress plugin.
      # Leave the secret unset and the plugin simply never gets pinged; visits
      # still happen normally.
      - name: Visit sites
        env:
          GHKA_TOKEN: ${{ secrets.GHKA_TOKEN }}
        run: |
          python scripts/keepalive.py \
            --sites sites.txt \
            --out "results/shard-${{ matrix.shard }}.csv" \
            --shard ${{ matrix.shard }} \
            --shards ${{ needs.plan.outputs.shards }} \
            --concurrency "${{ github.event.inputs.concurrency || '4' }}" \
            --limit "${{ github.event.inputs.limit || '0' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.shard }}
          path: results/shard-${{ matrix.shard }}.csv
          retention-days: 30

  report:
    needs: visit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: shard-*
          merge-multiple: true

      - name: Build report and update state
        id: report
        run: |
          set +e
          python scripts/report.py --results 'results/shard-*.csv'
          echo "alert=$?" >> "$GITHUB_OUTPUT"

      # Commit before failing the job, so the state and the actionable report
      # are always saved even on an alerting run.
      - name: Commit state and reports
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # These may not exist yet on a first run, or if report.py bailed out.
          mkdir -p state reports
          git add state reports
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Keep-alive run: update site state and reports"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
            git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt $attempt failed, retrying..."
            sleep $((attempt * 5))
          done
          exit 1

      # Stays red every run until the last recoverable site is dealt with, not
      # just on the run where it first broke. One missed email must not turn
      # into a silently deleted account.
      - name: Fail while any site is still recoverable
        if: steps.report.outputs.alert == '1'
        run: |
          echo "::error::Sites are down and still inside the recovery window. See reports/ATTENTION.md and reactivate them from the InfinityFree client area. This run stays red until they are back."
          exit 1

      # A different failure entirely: every shard died, so we know nothing about
      # any site. Must not be reported as "sites went down".
      - name: Fail if no results were produced
        if: steps.report.outputs.alert != '0' && steps.report.outputs.alert != '1'
        run: |
          echo "::error::No shard results were produced, so no site was actually checked. Look at the visit jobs above - this is an infrastructure failure, not a site failure."
          exit 1
